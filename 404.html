<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found – VortexDigitalAI</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --cyan:#00d4ff; --violet:#8b5cf6; --amber:#f59e0b; --rose:#f43f5e; --bg:#03080f; --ink:#e8edf5; --muted:#6b7a90; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(ellipse 80% 60% at 30% 20%, rgba(0,180,255,.12) 0%, transparent 55%),
                  radial-gradient(ellipse 70% 60% at 80% 80%, rgba(139,92,246,.1) 0%, transparent 55%), var(--bg);
      color: var(--ink); font-family: 'DM Sans', sans-serif; min-height: 100vh;
      display: grid; place-items: center; text-align: center; padding: 24px;
    }
    .code {
      font-family: 'Syne', sans-serif; font-weight: 800; font-size: clamp(5rem, 16vw, 9rem); line-height: 1;
      background: linear-gradient(90deg, var(--cyan), var(--violet), var(--amber), var(--rose));
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    h1 { font-family: 'Syne', sans-serif; font-size: 1.4rem; margin: 12px 0 10px; }
    p { color: var(--muted); max-width: 420px; margin: 0 auto 28px; line-height: 1.6; }
    a {
      display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
      background: linear-gradient(135deg, var(--cyan), var(--violet)); color: #fff;
      font-weight: 700; padding: 13px 26px; border-radius: 999px; box-shadow: 0 6px 24px rgba(0,212,255,.3);
    }
  </style>
</head>
<body>
  <div>
    <div class="code">404</div>
    <h1>This page took a wrong turn.</h1>
    <p>The page you're looking for doesn't exist or has moved. Let's get you back on track.</p>
    <a href="/">← Back to Home</a>
  </div>
</body>
</html>
